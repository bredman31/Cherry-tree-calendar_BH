<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dew Point — Buckhurst Hill</title>
<meta name="description" content="Predicted dew point for Buckhurst Hill, IG9" />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Dew Point" />
<meta name="theme-color" content="#0f4c75" />

<style>
  :root {
    --bg: #eef3f8;
    --card: #ffffff;
    --text: #16232e;
    --text-dim: #5b6b78;
    --border: #dde5ec;
    --accent: #0f4c75;
    --accent-soft: #0f4c751a;
    --dry: #d9a441;
    --comfy: #2b9e6b;
    --muggy: #d97a2c;
    --oppressive: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1520;
      --card: #121f2b;
      --text: #eaf1f7;
      --text-dim: #8ba0b2;
      --border: #223140;
      --accent: #5ec5ff;
      --accent-soft: #5ec5ff22;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  }

  main { width: 100%; max-width: 420px; }

  .widget {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px 22px 22px;
    box-shadow: 0 12px 30px -18px rgba(0,0,0,0.35);
  }

  .place {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .place h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .updated { font-size: 11px; color: var(--text-dim); white-space: nowrap; }

  .headline {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: 14px;
  }

  .dewIcon {
    width: 54px;
    height: 54px;
    flex-shrink: 0;
  }

  .value-wrap { flex: 1; min-width: 0; }

  .value {
    font-size: 52px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .value .unit { font-size: 22px; font-weight: 600; color: var(--text-dim); margin-left: 2px; }

  .label {
    margin-top: 6px;
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }

  .sub {
    margin-top: 14px;
    display: flex;
    gap: 18px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .sub b { color: var(--text); font-weight: 600; }

  .divider { height: 1px; background: var(--border); margin: 18px 0 14px; }

  .forecast h2 {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin: 0 0 10px;
  }

  .strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .strip::-webkit-scrollbar { display: none; }

  .hour {
    flex: 0 0 auto;
    width: 44px;
    text-align: center;
    padding: 8px 0 6px;
    border-radius: 10px;
    background: var(--accent-soft);
  }
  .hour .t { font-size: 10px; color: var(--text-dim); }
  .hour .v { font-size: 14px; font-weight: 700; margin-top: 4px; }
  .hour.now { outline: 2px solid var(--accent); outline-offset: -2px; }

  .note {
    margin-top: 14px;
    font-size: 11.5px;
    color: var(--text-dim);
    line-height: 1.4;
  }
  .note.error { color: var(--oppressive); }

  .refresh-btn {
    margin-top: 14px;
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .refresh-btn:active { background: var(--accent-soft); }

  .skeleton { opacity: 0.55; }
</style>
</head>
<body>

<main>
  <div class="widget" id="widget">
    <div class="place">
      <h1>Buckhurst Hill</h1>
      <span class="updated" id="updated">Loading…</span>
    </div>

    <div class="headline">
      <svg class="dewIcon" viewBox="0 0 24 24" fill="none" id="dewIcon">
        <path d="M12 2C12 2 5 11.5 5 16a7 7 0 0 0 14 0C19 11.5 12 2 12 2Z"
          fill="var(--accent)" opacity="0.9"/>
      </svg>
      <div class="value-wrap">
        <div class="value" id="value"><span id="valueNum">--</span><span class="unit">°C</span></div>
        <div class="label" id="label">—</div>
      </div>
    </div>

    <div class="sub">
      <div>Temp: <b id="temp">--°C</b></div>
      <div>Humidity: <b id="rh">--%</b></div>
    </div>

    <div class="divider"></div>

    <div class="forecast">
      <h2>Next 24 hours</h2>
      <div class="strip" id="strip"></div>
    </div>

    <div class="note" id="note">Fetching latest forecast…</div>

    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </div>
</main>

<script>
  // Buckhurst Hill, Essex, IG9
  const LAT = 51.6270;
  const LON = 0.0269;
  const TZ = "Europe/London";
  const STORAGE_KEY = "dewpoint-bh-cache-v1";
  const REFRESH_MS = 30 * 60 * 1000; // 30 minutes

  const els = {
    updated: document.getElementById("updated"),
    valueNum: document.getElementById("valueNum"),
    label: document.getElementById("label"),
    temp: document.getElementById("temp"),
    rh: document.getElementById("rh"),
    strip: document.getElementById("strip"),
    note: document.getElementById("note"),
    widget: document.getElementById("widget"),
    refreshBtn: document.getElementById("refreshBtn"),
  };

  function comfort(dewC) {
    if (dewC < 10) return { text: "Dry", cls: "dry" };
    if (dewC < 13) return { text: "Very comfortable", cls: "comfy" };
    if (dewC < 16) return { text: "Comfortable", cls: "comfy" };
    if (dewC < 18) return { text: "Slightly humid", cls: "muggy" };
    if (dewC < 21) return { text: "Humid", cls: "muggy" };
    if (dewC < 24) return { text: "Very humid", cls: "oppressive" };
    return { text: "Oppressive", cls: "oppressive" };
  }

  function fmtHour(iso) {
    const d = new Date(iso);
    return new Intl.DateTimeFormat("en-GB", {
      timeZone: TZ, hour: "numeric", hour12: true
    }).format(d).replace(" ", "").toLowerCase();
  }

  function fmtUpdated(d) {
    return new Intl.DateTimeFormat("en-GB", {
      timeZone: TZ, hour: "2-digit", minute: "2-digit"
    }).format(d);
  }

  function render(data, { stale } = {}) {
    const dew = Math.round(data.currentDew * 10) / 10;
    const c = comfort(dew);

    els.valueNum.textContent = dew.toFixed(1);
    els.label.textContent = c.text;
    els.temp.textContent = `${Math.round(data.currentTemp)}°C`;
    els.rh.textContent = `${Math.round(data.currentRh)}%`;

    els.strip.innerHTML = "";
    data.hourly.slice(0, 24).forEach((h, i) => {
      const cell = document.createElement("div");
      cell.className = "hour" + (i === 0 ? " now" : "");
      cell.innerHTML = `<div class="t">${i === 0 ? "now" : fmtHour(h.time)}</div><div class="v">${Math.round(h.dew)}°</div>`;
      els.strip.appendChild(cell);
    });

    const asOf = fmtUpdated(new Date(data.fetchedAt));
    els.updated.textContent = stale ? `Last updated ${asOf} (offline)` : `Updated ${asOf}`;
    els.note.classList.toggle("error", !!stale);
    els.note.textContent = stale
      ? "Showing the last saved reading — couldn't reach the forecast service."
      : "Forecast from Open-Meteo, refreshes automatically every 30 minutes.";

    els.widget.classList.remove("skeleton");
  }

  function saveCache(data) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function loadCache() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  async function fetchDewPoint() {
    const url = "https://api.open-meteo.com/v1/forecast" +
      `?latitude=${LAT}&longitude=${LON}` +
      "&current=temperature_2m,relative_humidity_2m,dew_point_2m" +
      "&hourly=dew_point_2m" +
      `&timezone=${encodeURIComponent(TZ)}` +
      "&forecast_days=2";

    const res = await fetch(url);
    if (!res.ok) throw new Error(`Forecast service returned ${res.status}`);
    const json = await res.json();

    const nowIso = json.current.time;
    const times = json.hourly.time;
    const dews = json.hourly.dew_point_2m;

    let startIdx = times.findIndex(t => t >= nowIso);
    if (startIdx === -1) startIdx = 0;

    const hourly = times.slice(startIdx).map((t, i) => ({
      time: t,
      dew: dews[startIdx + i],
    }));

    return {
      currentDew: json.current.dew_point_2m,
      currentTemp: json.current.temperature_2m,
      currentRh: json.current.relative_humidity_2m,
      hourly,
      fetchedAt: Date.now(),
    };
  }

  let refreshTimer = null;

  async function load() {
    try {
      const data = await fetchDewPoint();
      saveCache(data);
      render(data);
    } catch (err) {
      const cached = loadCache();
      if (cached) {
        render(cached, { stale: true });
      } else {
        els.note.classList.add("error");
        els.note.textContent = "Couldn't load the forecast: " + err.message;
        els.updated.textContent = "";
      }
    }
  }

  function scheduleRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(load, REFRESH_MS);
  }

  els.refreshBtn.addEventListener("click", load);

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") load();
  });

  const cached = loadCache();
  if (cached) render(cached, { stale: true });
  load();
  scheduleRefresh();
</script>

</body>
</html>
