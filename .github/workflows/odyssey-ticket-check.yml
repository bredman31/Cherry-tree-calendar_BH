name: Odyssey ticket tracker

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: odyssey-ticket-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: Run checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/check_odyssey_tickets.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-checker-debug
          path: |
            data/last_error.png
            data/debug_page.png
            data/debug_page.html
          if-no-files-found: ignore

      - name: Commit updated state
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/odyssey_dates.json)" ]; then
            git config user.name "odyssey-ticket-bot"
            git config user.email "actions@github.com"
            git add data/odyssey_dates.json
            git commit -m "Update Odyssey ticket tracker state"
            git push
          fi
