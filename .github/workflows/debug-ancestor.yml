name: Debug ancestor depth (temporary)

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright
          playwright install --with-deps chromium
      - run: python scripts/debug_ancestor_depth.py
      - run: python scripts/debug_fresh_aug2.py
